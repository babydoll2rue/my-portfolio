11px;letter-spacing:.01em}.m1{grid-column:2/span 3;--turn:-5deg;z-index:2}.m2{grid-column:5/span 4;--turn:3deg}.m3{grid-column:9/span 3;--turn:-3deg;z-index:3}.m4{grid-column:1/span 3;--turn:4deg}.m5{grid-column:4/span 4;--turn:-4deg;z-index:3}.m6{grid-column:8/span 4;--turn:5deg}.m7{grid-column:2/span 4;--turn:-3deg;z-index:2}.m8{grid-column:6/span 3;--turn:4deg}.m9{grid-column:9/span 3;--turn:-5deg;z-index:3}.m10{grid-column:1/span 3;--turn:3deg}.m11{grid-column:4/span 3;--turn:-5deg;z-index:2}.m12{grid-column:7/span 4;--turn:2deg}.m13{grid-column:2/span 4;--turn:4deg}.m14{grid-column:7/span 4;--turn:-4deg;z-index:2}
/* alternating real film-strip backing, not a photo filter */.m4:before,.m10:before,.m13:before{content:"";position:absolute;inset:-22px -12px;background:repeating-linear-gradient(90deg,#252421 0 13px,transparent 13px 24px) top/100% 12px no-repeat,repeating-linear-gradient(90deg,#252421 0 13px,transparent 13px 24px) bottom/100% 12px no-repeat,#272622;z-index:-1;box-shadow:1px 4px 10px #30291e30}.m4,.m10,.m13{margin:0 1px}.m4 .photo-open,.m10 .photo-open,.m13 .photo-open{padding:6px 6px 13px}.deco{pointer-events:none;z-index:0}.rose{width:100%;height:auto;filter:drop-shadow(1px 2px 1px #876b5d25)}.rose-one{grid-column:11/span 2;grid-row:2/span 2;transform:rotate(12deg);align-self:center;opacity:.83}.rose-two{grid-column:11/span 2;grid-row:5/span 2;transform:rotate(-17deg);opacity:.72}.film-note{grid-column:1/span 2;grid-row:4;display:flex;flex-direction:column;align-items:center;gap:5px;transform:rotate(-8deg);font:9px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7c685a;text-align:center}.film-note i{display:block;width:70px;border-bottom:1px solid #7f67585c}.film-note span:last-child{font:italic 13px Georgia,serif;letter-spacing:0;text-transform:none}.album-stamp{position:absolute;right:4%;bottom:1%;border:1px solid #8b433d91;color:#8b433d;padding:8px 12px;font:10px Arial,sans-serif;letter-spacing:.25em;transform:rotate(-7deg);text-transform:uppercase;opacity:.65}.ending{text-align:center;margin:38px auto 5px;font-style:italic;font-size:15px;color:#7b6c5f}footer{max-width:1170px;margin:auto;padding:22px 25px 36px;display:flex;justify-content:space-between;border-top:1px solid #746c5d3a;font:10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#8b7c6e}.viewer{position:fixed;inset:0;z-index:30;background:#191715f5;display:none;align-items:center;justify-content:center;padding:50px 70px}.viewer.active{display:flex}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.viewer button{position:absolute;background:transparent;border:0;color:white;cursor:pointer;font:32px Georgia,serif;padding:12px}.close{top:10px;right:18px}.prev{left:12px}.next{right:12px}.counter{position:absolute;bottom:20px;color:#e0d7c8;font:11px Arial,sans-serif;letter-spacing:.2em}
@media(max-width:700px){header{padding:18px}.header-note{display:none}main{padding:28px 9px 45px}.album{grid-template-columns:repeat(6,minmax(0,1fr));padding:20px 8px 32px}.memory{grid-column:span 3!important;grid-row:auto!important;margin:-3px -8px}.m1,.m5,.m9,.m13{grid-column:1/span 3!important}.m2,.m6,.m10,.m14{grid-column:4/span 3!important}.photo-open{padding:6px 6px 12px}.handwriting{font-size:11px;padding-top:7px}.deco{display:none}.album-stamp{display:none}.viewer{padding:45px 27px}.prev{left:0}.next{right:0}}@media(prefers-reduced-motion:reduce){.memory{transition:none}}

/* Organized, tightly spaced film diary — ready for additional photographs */
.album{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start;padding:24px 25px 35px;grid-auto-flow:row;}
.memory,.m1,.m2,.m3,.m4,.m5,.m6,.m7,.m8,.m9,.m10,.m11,.m12,.m13,.m14{grid-column:auto;grid-row:auto;margin:0;transform:none;z-index:1;min-width:0;}
.memory:hover{transform:translateY(-3px);z-index:4;}
.photo-open{padding:8px 8px 17px;box-shadow:0 2px 7px #392f2520,0 0 0 1px #c6bba75e;}
.picture{aspect-ratio:4/4.4;}
.handwriting{font-size:12px;padding-top:9px;}
.m4,.m10,.m13{margin:0;}
.m4:before,.m10:before,.m13:before{inset:-10px -5px;box-shadow:none;}
.m4 .photo-open,.m10 .photo-open,.m13 .photo-open{padding:8px 8px 17px;}
.deco.rose-one,.deco.rose-two{position:absolute;display:block;width:52px;grid-column:auto;grid-row:auto;z-index:2;pointer-events:none;}
.rose-one{right:-8px;top:15%;transform:rotate(12deg);}
.rose-two{left:-8px;top:68%;transform:rotate(-12deg);}
.film-note{position:absolute;right:22px;bottom:8px;grid-column:auto;grid-row:auto;transform:none;opacity:.65;}
.album-stamp{display:none;}
@media(max-width:700px){.album{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:16px 12px 24px;}.memory,.m1,.m2,.m3,.m4,.m5,.m6,.m7,.m8,.m9,.m10,.m11,.m12,.m13,.m14{grid-column:auto!important;grid-row:auto!important;margin:0!important;transform:none!important}.photo-open{padding:6px 6px 12px}.handwriting{font-size:10px}.deco.rose-one,.deco.rose-two{display:block;width:28px;}.film-note{display:none}}

</style></head><body><header><a class="brand" href="../index.html">Rue’s Babydolls</a><span class="header-note">a photographic keepsake · volume 01</span></header><main><section class="intro"><div class="eyebrow">found moments &amp; passing days</div><h1>little glimpses</h1><p>some things are too lovely to forget.</p><div class="divider-art">· ✳ ·</div></section><section class="album" aria-label="Vintage film diary photo gallery"><figure class="memory m1"><button class="photo-open" data-index="0" aria-label="Enlarge Sunday breakfast" type="button"><span class="picture"><img src="photos/photo-01.jpeg" alt="Sunday breakfast" loading="lazy"></span><span class="handwriting">dear diary</span></button></figure><figure class="memory m2"><button class="photo-open" data-index="1" aria-label="Enlarge A little sunshine" type="button"><span class="picture"><img src="photos/photo-02.jpeg" alt="A little sunshine" loading="lazy"></span><span class="handwriting">a little moment</span></button></figure><figure class="memory m3"><button class="photo-open" data-index="2" aria-label="Enlarge Blue hour" type="button"><span class="picture"><img src="photos/photo-03.jpeg" alt="Blue hour" loading="lazy"></span><span class="handwriting">somewhere, sometime</span></button></figure><div class="deco rose-one"><svg class="rose" viewBox="0 0 130 220" aria-hidden="true"><g fill="none" stroke="#9d302e" stroke-width="1.8" stroke-linecap="round"><path d="M64 82 C62 123 69 164 49 208"/><path d="M61 143 Q28 120 18 143 Q40 163 61 143Z"/><path d="M63 161 Q93 135 109 146 Q93 173 63 161Z"/><path d="M64 78 C39 84 28 60 40 43 C47 29 61 37 65 43 C78 27 99 38 96 57 C94 78 77 85 64 78Z"/><path d="M65 76 C46 65 51 47 66 45 C82 42 87 61 74 67 C62 70 60 59 68 56"/></g><g fill="#b53d37"><circle cx="42" cy="40" r="3"/><circle cx="34" cy="56" r="2.7"/><circle cx="42" cy="70" r="2"/><circle cx="56" cy="31" r="2.8"/><circle cx="80" cy="32" r="2.3"/><circle cx="97" cy="44" r="3"/><circle cx="101" cy="63" r="2"/><circle cx="85" cy="82" r="2.5"/><circle cx="60" cy="88" r="2"/><circle cx="73" cy="51" r="2"/><circle cx="56" cy="62" r="2"/></g></svg></div><figure class="memory m4"><button class="photo-open" data-index="3" aria-label="Enlarge Golden city" type="button"><span class="picture"><img src="photos/photo-04.jpeg" alt="Golden city" loading="lazy"></span><span class="handwriting">remember this</span></button></figure><figure class="memory m5"><button class="photo-open" data-index="4" aria-label="Enlarge Love in the square" type="button"><span class="picture"><img src="photos/photo-06.jpeg" alt="Love in the square" loading="lazy"></span><span class="handwriting">a day to keep</span></button></figure><figure class="memory m6"><button class="photo-open" data-index="5" aria-label="Enlarge Snow day" type="button"><span class="picture"><img src="photos/photo-07.jpg" alt="Snow day" loading="lazy"></span><span class="handwriting">forever & always</span></button></figure><figure class="memory m7"><button class="photo-open" data-index="6" aria-label="Enlarge Somewhere above the clouds" type="button"><span class="picture"><img src="photos/photo-08.jpeg" alt="Somewhere above the clouds" loading="lazy"></span><span class="handwriting">passing through</span></button></figure><figure class="memory m8"><button class="photo-open" data-index="7" aria-label="Enlarge Flowers, always" type="button"><span class="picture"><img src="photos/photo-09.jpeg" alt="Flowers, always" loading="lazy"></span><span class="handwriting">all the little things</span></button></figure><div class="deco film-note"><span>35 mm / 01</span><i></i><i></i><i></i><i></i><i></i><span>exposures of ordinary magic</span></div><figure class="memory m9"><button class="photo-open" data-index="8" aria-label="Enlarge Autumn afternoon" type="button"><span class="picture"><img src="photos/photo-10.jpeg" alt="Autumn afternoon" loading="lazy"></span><span class="handwriting">in between seasons</span></button></figure><figure class="memory m10"><button class="photo-open" data-index="9" aria-label="Enlarge A night to remember" type="button"><span class="picture"><img src="photos/photo-13.jpeg" alt="A night to remember" loading="lazy"></span><span class="handwriting">this felt like magic</span></button></figure><figure class="memory m11"><button class="photo-open" data-index="10" aria-label="Enlarge Cloud watching" type="button"><span class="picture"><img src="photos/photo-14.jpeg" alt="Cloud watching" loading="lazy"></span><span class="handwriting">under the same sky</span></button></figure><figure class="memory m12"><button class="photo-open" data-index="11" aria-label="Enlarge On the road" type="button"><span class="picture"><img src="photos/photo-15.jpeg" alt="On the road" loading="lazy"></span><span class="handwriting">slow afternoons</span></button></figure><div class="deco rose-two"><svg class="rose" viewBox="0 0 130 220" aria-hidden="true"><g fill="none" stroke="#9d302e" stroke-width="1.8" stroke-linecap="round"><path d="M64 82 C62 123 69 164 49 208"/><path d="M61 143 Q28 120 18 143 Q40 163 61 143Z"/><path d="M63 161 Q93 135 109 146 Q93 173 63 161Z"/><path d="M64 78 C39 84 28 60 40 43 C47 29 61 37 65 43 C78 27 99 38 96 57 C94 78 77 85 64 78Z"/><path d="M65 76 C46 65 51 47 66 45 C82 42 87 61 74 67 C62 70 60 59 68 56"/></g><g fill="#b53d37"><circle cx="42" cy="40" r="3"/><circle cx="34" cy="56" r="2.7"/><circle cx="42" cy="70" r="2"/><circle cx="56" cy="31" r="2.8"/><circle cx="80" cy="32" r="2.3"/><circle cx="97" cy="44" r="3"/><circle cx="101" cy="63" r="2"/><circle cx="85" cy="82" r="2.5"/><circle cx="60" cy="88" r="2"/><circle cx="73" cy="51" r="2"/><circle cx="56" cy="62" r="2"/></g></svg></div><figure class="memory m13"><button class="photo-open" data-index="12" aria-label="Enlarge Last light" type="button"><span class="picture"><img src="photos/photo-16.jpeg" alt="Last light" loading="lazy"></span><span class="handwriting">the last light</span></button></figure><figure class="memory m14"><button class="photo-open" data-index="13" aria-label="Enlarge The little corners" type="button"><span class="picture"><img src="photos/photo-17.jpeg" alt="The little corners" loading="lazy"></span><span class="handwriting">until next time</span></button></figure><span class="album-stamp">archive no. 001</span></section><p class="ending">and i would live it all again.</p></main><footer><span>the little things, kept forever</span><span>rue’s babydolls · 01</span></footer><div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer"><button class="close" aria-label="Close">×</button><button class="prev" aria-label="Previous">‹</button><img id="full" alt=""><button class="next" aria-label="Next">›</button><div class="counter" id="counter"></div></div><script>const photos=[...document.querySelectorAll('.memory img')],viewer=document.getElementById('viewer'),full=document.getElementById('full'),counter=document.getElementById('counter');let current=0;function show(n){current=(n+photos.length)%photos.length;full.src=photos[current].src;full.alt=photos[current].alt;counter.textContent=String(current+1).padStart(2,'0')+' / '+photos.length;viewer.classList.add('active');document.body.style.overflow='hidden'}function close(){viewer.classList.remove('active');document.body.style.overflow='';full.removeAttribute('src')}document.querySelectorAll('.photo-open').forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.index))));document.querySelector('.close').onclick=close;document.querySelector('.prev').onclick=()=>show(current-1);document.querySelector('.next').onclick=()=>show(current+1);viewer.addEventListener('click',e=>{if(e.target===viewer)close()});document.addEventListener('keydown',e=>{if(!viewer.classList.contains('active'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});</script></body></html>
